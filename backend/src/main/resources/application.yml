
server:
  port: 8089
  forward-headers-strategy: framework

spring:
  application:
    name: pharmacy-delivery-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pharmacy_delivery?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cache:
    type: redis
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: archive

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cors:
    allowed-origin: http://localhost:5173
  order:
    delivery-fee: 5.00
    payment-timeout: 30m
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  prescription:
    storage-path: ${PRESCRIPTION_STORAGE_PATH:./data/prescriptions}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    replay-interval-ms: ${EVENT_REPLAY_INTERVAL_MS:60000}
    replay-initial-delay-ms: ${EVENT_REPLAY_INITIAL_DELAY_MS:30000}
  redis:
    distributed-locks-enabled: ${REDIS_DISTRIBUTED_LOCKS_ENABLED:false}
  observability:
    event-gauge-refresh-ms: ${EVENT_GAUGE_REFRESH_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
