# Linux-native Prometheus scrape config for 速安药房 V2.
# Prefer scraping loopback or a private interface. Nginx publicly denies /actuator/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/pharmacy-alerts.yml

scrape_configs:
  - job_name: pharmacy-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:8089"]
        labels:
          application: pharmacy-delivery-backend
    # If actuator prometheus is authenticated, configure a local reverse proxy
    # or scrape via SSH tunnel. Do not expose /actuator publicly.
