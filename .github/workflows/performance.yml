name: V2 performance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: explain-only or full 100VU/10min k6
        type: choice
        options: [full, explain]
        default: full
      duration:
        description: k6 duration
        type: string
        default: 10m
      vus:
        description: k6 VUs
        type: string
        default: '100'
  schedule:
    - cron: '0 18 * * 0'
  pull_request:
    branches: [codex/v2-enterprise-upgrade]
    paths:
      - 'performance/**'
      - 'backend/src/main/resources/db/migration/V5__performance_indexes.sql'
      - '.github/workflows/performance.yml'

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_URL: jdbc:mysql://localhost:3306/pharmacy_delivery_perf?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: pharmacy_perf
      DB_PASSWORD: perf-only-password
      JWT_SECRET: perf-only-signing-key-with-at-least-thirty-two-bytes
      MESSAGING_ENABLED: 'true'
      SPRING_CACHE_TYPE: redis
      P1_DB_NAME: pharmacy_delivery_perf
      P1_DB_USER: pharmacy_perf
      P1_DB_PASSWORD: perf-only-password
      P1_DB_HOST: 127.0.0.1
      P1_DB_PORT: '3306'
      P1_OUT_DIR: ${{ github.workspace }}/performance/out
      P1_APP_PORT: '18093'
      P1_MODE: ${{ github.event.inputs.mode || 'full' }}
      DURATION: ${{ github.event.inputs.duration || '10m' }}
      VUS: ${{ github.event.inputs.vus || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Start native infrastructure and performance database
        run: |
          sudo systemctl start mysql.service
          sudo apt-get update -qq
          sudo apt-get install -y redis-server rabbitmq-server
          sudo systemctl start redis-server rabbitmq-server
          MYSQL_PWD=root mysql --user=root -e "CREATE DATABASE IF NOT EXISTS pharmacy_delivery_perf CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER IF NOT EXISTS 'pharmacy_perf'@'localhost' IDENTIFIED BY 'perf-only-password'; GRANT ALL ON pharmacy_delivery_perf.* TO 'pharmacy_perf'@'localhost'; FLUSH PRIVILEGES;"
      - name: Build backend
        working-directory: backend
        run: mvn --batch-mode -DskipTests package
      - name: Run explain, optional k6, and reconciliation
        run: bash performance/scripts/run-perf.sh "${P1_MODE}"
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-performance-report
          path: |
            performance/out/
          if-no-files-found: warn
