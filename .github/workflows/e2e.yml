name: V2 Playwright E2E

on:
  pull_request:
    branches: [codex/v2-enterprise-upgrade]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start native infrastructure and E2E database
        run: |
          sudo systemctl start mysql.service
          sudo apt-get update -qq
          sudo apt-get install -y redis-server rabbitmq-server
          sudo systemctl start redis-server rabbitmq-server
          MYSQL_PWD=root mysql --user=root -e "CREATE DATABASE IF NOT EXISTS pharmacy_delivery_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER IF NOT EXISTS 'pharmacy_e2e'@'localhost' IDENTIFIED BY 'e2e-only-password'; GRANT ALL ON pharmacy_delivery_e2e.* TO 'pharmacy_e2e'@'localhost';"
      - name: Build backend for E2E
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/pharmacy_delivery_e2e?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          DB_USERNAME: pharmacy_e2e
          DB_PASSWORD: e2e-only-password
          JWT_SECRET: e2e-only-signing-key-with-at-least-thirty-two-bytes
          MESSAGING_ENABLED: 'false'
          SPRING_CACHE_TYPE: simple
        run: mvn --batch-mode -DskipTests package
      - name: Start backend for E2E
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/pharmacy_delivery_e2e?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          DB_USERNAME: pharmacy_e2e
          DB_PASSWORD: e2e-only-password
          JWT_SECRET: e2e-only-signing-key-with-at-least-thirty-two-bytes
          MESSAGING_ENABLED: 'false'
          SPRING_CACHE_TYPE: simple
          PRESCRIPTION_STORAGE_PATH: /tmp/pharmacy-e2e-prescriptions
          APP_CORS_ALLOWED_ORIGIN: http://127.0.0.1:4173
        run: |
          java -jar target/pharmacy-delivery-backend-1.0.0.jar --server.port=8089 > /tmp/pharmacy-e2e.log 2>&1 &
          echo $! > /tmp/pharmacy-e2e.pid
          for attempt in {1..30}; do curl --fail --silent http://localhost:8089/actuator/health && exit 0; sleep 2; done
          cat /tmp/pharmacy-e2e.log
          exit 1
      - name: Build frontend and install Playwright
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start frontend preview
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pharmacy-frontend-e2e.log 2>&1 &
          echo $! > /tmp/pharmacy-frontend-e2e.pid
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173 >/dev/null && exit 0; sleep 2; done
          cat /tmp/pharmacy-frontend-e2e.log
          exit 1
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          E2E_API_BASE_URL: http://127.0.0.1:8089/api
          E2E_DB_NAME: pharmacy_delivery_e2e
          E2E_DB_USER: pharmacy_e2e
          E2E_DB_PASSWORD: e2e-only-password
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '3306'
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
